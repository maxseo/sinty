<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как помнит Синти</title>
<style>
  :root { --bg:#f3f0e8; --ink:#1c1915; --muted:#6b645b; --line:#ddd4c6; --card:#fffdf8; --green:#1f7a4d; --greenbg:#e5f4ec; --amber:#9a5b00; --amberbg:#fff1d6; --blue:#1d4e89; --bluebg:#e7f0fa; --dim:#f6f3ed; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI", sans-serif; }
  header { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; }
  header .sp { flex: 1; }
  button, select { font: inherit; cursor: pointer; }
  button, select { height: 34px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 12px; }
  main { height: calc(100% - 58px); display: grid; grid-template-columns: 250px 1fr; }
  nav { border-right: 1px solid var(--line); overflow: auto; padding: 10px; }
  nav button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; height: auto; padding: 8px 10px; color: var(--muted); }
  nav button.on { background: #fff; color: var(--ink); font-weight: 650; }
  .view { min-width: 0; display: grid; grid-template-rows: 1fr auto; }
  .stage { min-height: 0; padding: 16px 20px 0; }
  svg { width: 100%; height: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .say { padding: 14px 22px 18px; }
  .say .k { color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .say h1 { margin: 2px 0 4px; font-size: 22px; }
  .say p { margin: 0; max-width: 920px; font-size: 16.5px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } nav { display: flex; border-right: 0; border-bottom: 1px solid var(--line); } nav button { width: auto; white-space: nowrap; } }
</style>
</head>
<body>
<header>
  <b>Как помнит Синти</b>
  <span id="where"></span>
  <div class="sp"></div>
  <button id="prev" type="button">Назад</button>
  <button id="next" type="button">Дальше</button>
</header>
<main>
  <nav id="nav"></nav>
  <div class="view">
    <div class="stage"><svg id="svg" viewBox="0 0 980 560" role="img"></svg></div>
    <article class="say">
      <div class="k" id="kicker"></div>
      <h1 id="title"></h1>
      <p id="text"></p>
    </article>
  </div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
function node(name, attrs, text) {
  const el = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}
function clear() { while (svg.firstChild) svg.removeChild(svg.firstChild); }
function box(x, y, w, h, fill, stroke) {
  svg.append(node("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: stroke || "#ddd4c6", "stroke-width": 1.5 }));
}
function label(x, y, text, size, fill, anchor) {
  svg.append(node("text", { x, y, "font-size": size || 15, fill: fill || "#1c1915", "font-family": "Segoe UI, sans-serif", "text-anchor": anchor || "start" }, text));
}
function arrow(x1, y1, x2, y2) {
  svg.append(node("line", { x1, y1, x2, y2, stroke: "#1f7a4d", "stroke-width": 2.5, "marker-end": "url(#ah)" }));
}
function marker() {
  const d = node("defs", {});
  const m = node("marker", { id: "ah", markerWidth: 10, markerHeight: 8, refX: 8, refY: 4, orient: "auto" });
  m.append(node("path", { d: "M0 0 L10 4 L0 8 Z", fill: "#1f7a4d" }));
  d.append(m);
  svg.append(d);
}

const scenes = [
  { name: "Промпт", beats: [
    { k: "Ход · 1", t: "Фраза остаётся в журнале", d: "«Меня зовут Макс, живу в Казани, запомни» записывается в журнал чата дословно. Свёртка потом укорачивает только копию, которую видит модель. Сам журнал не вычищается.", draw: journal },
    { k: "Ход · 2", t: "Четыре слоя, сверху вниз", d: "Модель читает слои по порядку. Первые два заморожены на время чата: их не переписывают каждый ход, иначе сбрасывается кэш. Свежее этого хода стоит внизу.", draw: () => layers(0) },
    { k: "Ход · 3", t: "В снимке только карточки «рядом»", d: "Пустой запрос к памяти собирает короткий список: человек, предпочтения, факты. Не больше примерно 3000 символов и 40 карточек. Решение и вопрос в этот список не входят. Список подчиняется тем же правилам чата и проекта, что и поиск.", draw: () => layers(1) },
    { k: "Ход · 4", t: "Новая карточка не вклеивается в снимок", d: "То, что сохранили в этом ходе, приедет следующим ходом отдельным блоком memory.updates. Замороженный снимок остаётся прежним.", draw: () => layers(2) }
  ]},
  { name: "Свёртка", beats: [
    { k: "Свёртка · 1", t: "Пока линейка не дошла до метки, диалог целиком", d: "Считаются токены диалога, не число сообщений. Метка — 65% окна модели, но не дальше потолка 150 000. Ближняя метка и есть порог. У окна 128 000 это 83 200, и оно ближе, чем 150 000. Неизвестное окно считается как 128 000. Свой потолок — memory.compactCapTokens; ноль или пусто снимает потолок.", draw: ruler },
    { k: "Свёртка · 2", t: "Режется старое, хвост остаётся", d: "В конспект уходит всё раньше последних 12 ваших реплик. Эти 12 и ответы между ними остаются как написаны. Если хвост сам толще половины порога, его укорачивают, но не короче 2 реплик. Разрез делается до первого шага модели в ходе.", draw: cut },
    { k: "Свёртка · 3", t: "Инструменты режутся отдельно и раньше", d: "Это не конспект. Ответы инструментов старше тех же 12 реплик остаются первыми 15 строками. Граница сдвигается шагом в 8 ваших реплик, чтобы кэш не переписывался каждый ход.", draw: tools },
    { k: "Свёртка · 4", t: "Кто пишет конспект", d: "Берётся первая найденная служебная модель: с карточки агента, иначе с установки, иначе основная модель этого агента, иначе модель по умолчанию. Ответ ограничен 2000 токенами.", draw: ladder },
    { k: "Свёртка · 5", t: "Четыре куска одного запроса", d: "Сверху прежний конспект или фраза, что его нет. Затем поле «Сжатие переписки», затем поле «Факты», затем текст уходящего диалога до 80 000 символов. Пустое поле агента заменяется полем установки, пустое и там — текстом по умолчанию.", draw: promptParts },
    { k: "Свёртка · 6", t: "Ответ разъезжается в два места", d: "summary становится конспектом чата и дальше стоит в замороженном блоке conversation_summary. facts пишутся в память: про вас или уровня profile — карточка «предпочтение», остальное — «факт». Если плагин включён, пишет он. Если модель промолчала, хвост всё равно остаётся один, конспект не обновляется, журнал цел.", draw: fork }
  ]},
  { name: "После ответа", beats: [
    { k: "Запись · 1", t: "«Запомни» сохраняется сразу", d: "Строка, которая начинается с «запомни» или «remember», пишется как факт без дешёвой модели. В карточку попадает тело фразы, не само слово. Пароль, ключ и токен отбрасываются.", draw: explicit },
    { k: "Запись · 2", t: "Дешёвая модель читает только вас", d: "Маршрут cheap получает ваши слова этого хода, не ответ агента, хвост до 6000 символов. В ответе не больше трёх карточек: текст, тип и дословная цитата. Ответ до 400 токенов.", draw: cheap },
    { k: "Запись · 3", t: "Цитаты нет во фразе — карточки нет", d: "Догадка сохраняется только если цитата является куском вашей фразы. Повтор той же нормализованной строки не создаёт вторую сферу. Дочерняя задача агента карточки не пишет.", draw: gate }
  ]},
  { name: "Карточка", beats: [
    { k: "Карточка · 1", t: "Одна сфера — одна карточка", d: "Цвет задаёт тип. Человек и предпочтение всегда про вас и срок «рядом». Факт в проекте живёт в проекте, без проекта — у вас, тоже «рядом». Решение и вопрос живут в проекте или, если проекта нет, в этом чате, и срок у них «долго».", draw: faces },
    { k: "Карточка · 2", t: "Что написано на лице", d: "Текст, цитата, основание, тема, дом, срок, состояние, время касания. Связь с другой карточкой появляется только если её передал инструмент. Обычный разбор фразы тему не заполняет, поэтому «Казань» само не сменится на «Пермь».", draw: anatomy }
  ]},
  { name: "Замена", beats: [
    { k: "Правда · 1", t: "Та же фраза усиливает одну карточку", d: "Вторая запись с тем же текстом, даже под другим типом, обновляет ту же сферу: уверенность становится 1, тип берётся от новой записи.", draw: reinforce },
    { k: "Правда · 2", t: "Та же тема закрывает старую", d: "Новая карточка с тем же аккаунтом, агентом и темой ставит прежнюю в состояние «было» и записывает момент. Без слова «раньше» поиск её уже не показывает. На графе она остаётся тусклой.", draw: supersede }
  ]},
  { name: "Кто видит", beats: [
    { k: "Доступ · 1", t: "Пара: ваш аккаунт и этот агент", d: "Чужой аккаунт и другой ваш агент эти карточки не читают. Вкладка на карточке агента смотрит того пользователя, под которым открыт веб.", draw: pair },
    { k: "Доступ · 2", t: "Режим и три тумблера", d: "Этот чат видит свои карточки и, если включено «о пользователе», карточки про вас. Этот проект добавляет факты проекта. «Решения и вопросы этого проекта» отдельно пускает решения и вопросы из других чатов того же проекта. «Другие проекты» работает только в режиме всех проектов агента. Карточка этого самого чата видна всегда.", draw: gates }
  ]},
  { name: "Поиск", beats: [
    { k: "Поиск · 1", t: "Пустой запрос — это блок памяти", d: "Ядро спрашивает память без текста, когда собирает снимок. Плагин отдаёт короткий список «рядом», уже пропущенный через правила этого чата.", draw: indexBeat },
    { k: "Поиск · 2", t: "Слова считают совпадения", d: "Запрос режется на слова длиннее одной буквы. Совпадение ищется в тексте и в теме. Сначала отсекается политика, потом прошлое. Доля совпавших слов и есть порядок выдачи.", draw: words },
    { k: "Поиск · 3", t: "«Раньше» открывает закрытое", d: "Слова раньше, прежде, было, бывало, used to и before добавляют карточки со состоянием «было». Забывание ставит это состояние и не трогает журнал.", draw: history }
  ]},
  { name: "Ночь", beats: [
    { k: "Ночь · 1", t: "День — календарь этой машины", d: "В 04:00 по часам машины, если включён ночной разбор, берутся живые карточки, которых касались в эту календарную дату. Дата внутри метки переводится в местный день, а не обрезается как UTC. Кнопка «Разобрать сегодня» делает то же сразу.", draw: clock },
    { k: "Ночь · 2", t: "Заметка лежит рядом с карточками", d: "Дешёвая модель получает список карточек дня и пишет заметку до 700 токенов, без фактов, которых в списке нет. Заметка хранится отдельно: аккаунт, агент, дата. Карточки не заменяются. Неделя и месяц из этих заметок не собираются.", draw: dayNote },
    { k: "Ночь · 3", t: "Ресёрч — это абзац в том же запросе", d: "Веб-поиск остаётся инструментом агента в чате. Тумблер «ресёрч в ночном разборе» дописывает вашу подсказку, до 2000 символов, в ночной запрос. Модели сказано не выдумывать источники: если карточек мало, заметка говорит, что проверить потом в чате.", draw: research }
  ]}
];

function journal() {
  marker();
  box(70, 150, 280, 220, "#fffdf8");
  label(92, 190, "ВЫ", 12, "#6b645b");
  label(92, 230, "Меня зовут Макс,", 22);
  label(92, 262, "живу в Казани,", 22);
  label(92, 294, "запомни", 22, "#1f7a4d");
  arrow(350, 260, 430, 260);
  box(430, 120, 460, 300, "#fffdf8");
  label(454, 160, "ЖУРНАЛ ЧАТА", 12, "#6b645b");
  label(454, 210, "реплика сохранена целиком", 18);
  label(454, 250, "время, кто сказал, текст", 16, "#6b645b");
  label(454, 310, "этот файл потом не режут", 16, "#1f7a4d");
}
function layers(on) {
  const rows = [
    ["1", "Система", "инструкция агента", "#f6f3ed"],
    ["2", "Снимок", "память «рядом» + конспект", on === 1 ? "#e5f4ec" : "#fffdf8"],
    ["3", "Диалог", "журнал или хвост после свёртки", "#fffdf8"],
    ["4", "Этот ход", on === 2 ? "memory.updates — новая карточка" : "поиск по фразе этого хода", on === 2 ? "#e7f0fa" : "#fffdf8"]
  ];
  rows.forEach((row, i) => {
    const y = 70 + i * 110;
    box(180, y, 620, 90, row[3], i === on ? "#1f7a4d" : "#ddd4c6");
    label(210, y + 38, row[0], 14, "#6b645b");
    label(250, y + 40, row[1], 22);
    label(250, y + 68, row[2], 16, "#6b645b");
  });
}
function ruler() {
  box(80, 160, 820, 120, "#fffdf8");
  svg.append(node("rect", { x: 110, y: 210, width: 760, height: 22, rx: 11, fill: "#efeae1" }));
  svg.append(node("rect", { x: 110, y: 210, width: 500, height: 22, rx: 11, fill: "#1f7a4d" }));
  label(110, 190, "0", 13, "#6b645b");
  label(590, 190, "83 200  ·  65% окна 128 000", 14, "#1f7a4d");
  label(760, 190, "150 000 потолок", 14, "#9a5b00");
  svg.append(node("line", { x1: 610, y1: 200, x2: 610, y2: 246, stroke: "#1f7a4d", "stroke-width": 2 }));
  svg.append(node("line", { x1: 820, y1: 200, x2: 820, y2: 246, stroke: "#9a5b00", "stroke-width": 2 }));
  label(110, 280, "Ниже ближней метки свёртки нет. У окна в миллион ближняя метка — потолок 150 000.", 16, "#6b645b");
}
function cut() {
  box(60, 140, 520, 260, "#fff1d6", "#e2c48a");
  label(84, 180, "УХОДИТ В КОНСПЕКТ", 12, "#9a5b00");
  label(84, 230, "все реплики раньше хвоста", 20);
  box(620, 140, 290, 260, "#e5f4ec", "#b7deca");
  label(644, 180, "ОСТАЁТСЯ", 12, "#1f7a4d");
  label(644, 230, "12 ваших", 28);
  label(644, 268, "реплик", 28);
  label(644, 320, "минимум 2", 16, "#6b645b");
  svg.append(node("line", { x1: 590, y1: 120, x2: 590, y2: 430, stroke: "#1c1915", "stroke-width": 2, "stroke-dasharray": "6 6" }));
  label(500, 110, "разрез", 14);
}
function tools() {
  box(80, 150, 360, 240, "#fff1d6", "#e2c48a");
  label(104, 190, "СТАРЫЙ ИНСТРУМЕНТ", 12, "#9a5b00");
  label(104, 240, "первые 15 строк", 26);
  label(104, 290, "дальше отрезано", 16, "#6b645b");
  box(520, 150, 380, 240, "#e5f4ec", "#b7deca");
  label(544, 190, "ПОСЛЕДНИЕ 12 РЕПЛИК", 12, "#1f7a4d");
  label(544, 240, "инструменты целиком", 24);
  label(544, 300, "граница шагает на 8 реплик", 16, "#6b645b");
}
function ladder() {
  const rows = [["1", "Карточка агента", "служебная модель"], ["2", "Установка", "service.model"], ["3", "Этот агент", "основная модель"], ["4", "По умолчанию", "models.default"]];
  rows.forEach((row, i) => {
    const y = 80 + i * 110;
    box(220, y, 540, 90, i === 0 ? "#e5f4ec" : "#fffdf8", i === 0 ? "#1f7a4d" : "#ddd4c6");
    label(248, y + 40, row[0], 14, "#6b645b");
    label(290, y + 38, row[1], 22);
    label(290, y + 66, row[2], 16, "#6b645b");
    if (i < 3) label(180, y + 130, "нет", 13, "#9a5b00");
  });
}
function promptParts() {
  const rows = [
    ["Было", "прошлый конспект или «summary ещё нет»"],
    ["Сжатие", "цели, решения, обещания, пути, что уже сделано"],
    ["Факты", "profile — предпочтение, log — событие, note — временно"],
    ["Лента", "диалог до 80 000 символов, кусок события до ~1500"]
  ];
  rows.forEach((row, i) => {
    box(140, 50 + i * 120, 700, 100, i === 3 ? "#fff1d6" : "#fffdf8");
    label(168, 92 + i * 120, row[0], 22);
    label(168, 122 + i * 120, row[1], 16, "#6b645b");
  });
}
function fork() {
  marker();
  box(60, 190, 250, 160, "#e7f0fa", "#c5d7ef");
  label(84, 230, "JSON", 12, "#1d4e89");
  label(84, 270, "summary", 26);
  label(84, 304, "facts[]", 26);
  arrow(310, 230, 400, 140);
  arrow(310, 310, 400, 390);
  box(400, 70, 500, 150, "#e5f4ec", "#b7deca");
  label(424, 115, "КОНСПЕКТ ЧАТА", 12, "#1f7a4d");
  label(424, 155, "conversation_summary", 24);
  box(400, 330, 500, 150, "#fffdf8");
  label(424, 375, "КАРТОЧКИ ПАМЯТИ", 12, "#6b645b");
  label(424, 415, "предпочтение или факт", 24);
}
function explicit() {
  marker();
  box(80, 170, 340, 200, "#fffdf8");
  label(104, 220, "запомни", 16, "#9a5b00");
  label(104, 270, "меня зовут Макс", 28);
  arrow(420, 270, 520, 270);
  box(520, 160, 380, 220, "#e5f4ec", "#b7deca");
  label(544, 210, "ФАКТ", 12, "#1f7a4d");
  label(544, 260, "меня зовут Макс", 26);
  label(544, 310, "вы попросили · без модели", 16, "#6b645b");
}
function cheap() {
  box(70, 150, 300, 240, "#fffdf8");
  label(94, 200, "ВАШИ СЛОВА", 12, "#6b645b");
  label(94, 250, "до 6000 символов", 22);
  label(94, 300, "ответ агента не читается", 16, "#6b645b");
  box(430, 150, 460, 240, "#fff1d6", "#e2c48a");
  label(454, 200, "МАРШРУТ CHEAP", 12, "#9a5b00");
  label(454, 250, "до 3 карточек", 28);
  label(454, 300, "текст · тип · цитата", 18);
  label(454, 340, "ответ до 400 токенов", 16, "#6b645b");
}
function gate() {
  box(80, 160, 360, 200, "#fffdf8");
  label(104, 210, "ЦИТАТА", 12, "#6b645b");
  label(104, 260, "«живу в Казани»", 26);
  label(104, 310, "есть внутри фразы", 16, "#1f7a4d");
  box(520, 80, 380, 160, "#e5f4ec", "#b7deca");
  label(544, 130, "СОХРАНИТЬ", 12, "#1f7a4d");
  label(544, 175, "цитата ⊂ фраза", 26);

let si = 0, bi = 0;
const nav = document.getElementById("nav");
scenes.forEach((scene, i) => {
  const b = document.createElement("button");
  b.textContent = String(i + 1).padStart(2, "0") + "  " + scene.name;
  b.onclick = () => { si = i; bi = 0; render(); };
  nav.append(b);
});
function render() {
  const beat = scenes[si].beats[bi];
  clear();
  beat.draw();
  document.getElementById("kicker").textContent = beat.k + "   ·   шаг " + (bi + 1) + " из " + scenes[si].beats.length;
  document.getElementById("title").textContent = beat.t;
  document.getElementById("text").textContent = beat.d;
  document.getElementById("where").textContent = scenes[si].name;
  [...nav.children].forEach((el, i) => el.classList.toggle("on", i === si));
}
function go(dir) {
  bi += dir;
  if (bi >= scenes[si].beats.length) { bi = 0; si = (si + 1) % scenes.length; }
  if (bi < 0) { si = (si - 1 + scenes.length) % scenes.length; bi = scenes[si].beats.length - 1; }
  render();
}
document.getElementById("next").onclick = () => go(1);
document.getElementById("prev").onclick = () => go(-1);
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
render();
</script>
